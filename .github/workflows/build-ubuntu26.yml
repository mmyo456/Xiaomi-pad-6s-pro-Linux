name: Build Ubuntu 26.04 KDE Desktop

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本'
        required: true
        default: '7.1'
      kernel_channel:
        description: '内核通道'
        required: true
        type: choice
        options: [mainline, stable]
        default: 'mainline'
      desktop_env:
        description: '桌面环境'
        required: true
        type: choice
        options: [kde, gnome, xfce]
        default: 'kde'
      boot_mode:
        description: '启动模式'
        required: true
        type: choice
        options: [dual, single]
        default: 'dual'
      skip_release:
        description: '跳过创建 GitHub Release'
        type: boolean
        default: false

  push:
    branches: [sheng]
    paths:
      - 'build-ubuntu26-rootfs.sh'
      - 'lib/rootfs-common.sh'
      - '.github/workflows/build-ubuntu26.yml'
      - '.github/workflows/_rootfs-template.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_rootfs-template.yml
    with:
      distro: ubuntu
      script: build-ubuntu26-rootfs.sh
      kernel_version_default: ${{ inputs.kernel_version || '7.1' }}
      kernel_channel_default: 'mainline'
      kernel_channel: ${{ inputs.kernel_channel || 'mainline' }}
      kernel_bundle_repo: 'code002-2/Xiaomi-pad-6s-pro-Linux'
      desktop_env: ${{ inputs.desktop_env || 'kde' }}
      boot_mode: ${{ inputs.boot_mode || 'dual' }}
      desktop_matrix: '["kde"]'
      boot_matrix: '["dual"]'
      release_tag_prefix: ubuntu26-kde
      release_body_title: 'Ubuntu 26.04 LTS KDE Desktop for Xiaomi Pad 6S Pro'
      skip_release: ${{ inputs.skip_release || false }}
    secrets: inherit
