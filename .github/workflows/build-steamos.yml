# =============================================================================
# Build SteamOS (Arch Linux ARM + parallel component builds)
# =============================================================================

name: Build SteamOS

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: 'Desktop Environment (this repair workflow always builds KDE)'
        type: choice
        options: [kde]
        # Keep the UI honest for manual runs too.  More importantly, the
        # build command below is deliberately pinned to KDE: push-triggered
        # runs have no workflow_dispatch inputs and used to create the
        # console-only default image.
        default: 'kde'
      launcher:
        description: 'Game Launcher'
        type: choice
        options: [steam, both, retroarch]
        default: 'steam'
      boot_mode:
        description: 'Boot Mode'
        type: choice
        options: ['dual (linux)', 'single (userdata)']
        default: 'dual (linux)'
      autologin:
        description: 'Autologin'
        type: boolean
        default: true
      username:
        description: 'Username'
        type: string
        default: 'gamer'
      hostname:
        description: 'Hostname'
        type: string
        default: 'sheng-steamos'
      kernel_source:
        description: 'Kernel Source'
        type: choice
        options: [prebuilt, custom_build]
        default: 'prebuilt'
      kernel_repo:
        description: 'Kernel Repo URL (custom_build)'
        type: string
        default: 'https://github.com/ianchb/sm8550-mainline'
      kernel_branch:
        description: 'Kernel Branch (custom_build)'
        type: string
        default: 'sheng-7.1.5'
      kernel_config:
        description: 'Kernel Config (custom_build)'
        type: string
        default: 'sm8550.config'
      firmware_repo:
        description: 'Firmware Repo URL'
        type: string
        default: 'https://github.com/ianchb/sheng-firmware'
      firmware_branch:
        description: 'Firmware Branch'
        type: string
        default: 'master'
      skip_release:
        description: 'Skip Release'
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - 'sheng-steamos_build.sh'
      - 'lib/gaming-packages.sh'
      - 'lib/rootfs-common.sh'
      - '.github/workflows/build-steamos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  # ==========================================================================
  # Kernel (optional: custom build)
  # ==========================================================================
  build-kernel:
    name: "Build Kernel"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Skip (Prebuilt)"
        if: ${{ inputs.kernel_source != 'custom_build' }}
        run: echo "Using prebuilt kernel, skipped"

      - name: "Checkout"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/checkout@v4

      - name: "Install Build Tools"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc ccache clang llvm lld

      - name: "Restore ccache"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-kernel-${{ inputs.kernel_branch }}-${{ hashFiles(inputs.kernel_config) }}

      - name: "Build Kernel"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        id: build
        run: |
          git clone "${{ inputs.kernel_repo }}" --branch "${{ inputs.kernel_branch }}" --depth 1 linux
          cp "${{ inputs.kernel_config }}" linux/.config
          cd linux
          export CCACHE_DIR=/home/runner/.ccache PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang" CXX="ccache clang++"
          make -j$(nproc) ARCH=arm64 LLVM=1
          KVER="$(make kernelrelease -s)"
          echo "kernel_version=$KVER" >> $GITHUB_OUTPUT
          make -j$(nproc) ARCH=arm64 LLVM=1 INSTALL_MOD_PATH="${{ github.workspace }}/linux-xiaomi-sheng" modules_install
          rm -rf "${{ github.workspace }}/linux-xiaomi-sheng/lib/modules/"*"/build"
          mkdir -p "${{ github.workspace }}/linux-xiaomi-sheng/boot"
          install -Dm644 arch/arm64/boot/Image.gz "${{ github.workspace }}/linux-xiaomi-sheng/boot/Image.gz"
          install -Dm644 arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb "${{ github.workspace }}/linux-xiaomi-sheng/boot/sm8550-xiaomi-sheng.dtb"
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb > "${{ github.workspace }}/Image.gz-dtb_sheng"

      - name: "Package Kernel .deb"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        run: |
          KVER="${{ steps.build.outputs.kernel_version }}"
          mkdir -p linux-xiaomi-sheng/DEBIAN
          cat > linux-xiaomi-sheng/DEBIAN/control << EOF
          Package: linux-xiaomi-sheng
          Version: ${KVER}
          Architecture: arm64
          Section: kernel
          Description: Kernel and Modules for Xiaomi Pad 6S Pro
          EOF
          dpkg-deb --build --root-owner-group linux-xiaomi-sheng

      - name: "Upload"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb
          path: linux-xiaomi-sheng.deb
          retention-days: 3

  # ==========================================================================
  # Device components (from debian-sheng, extracted into Arch rootfs)
  # ==========================================================================
  build-device-components:
    name: "Build Device Components"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            pkg-config libyaml-dev linux-libc-dev ninja-build python3-pip \
            libglib2.0-dev libgudev-1.0-dev libpolkit-gobject-1-dev \
            libprotobuf-c-dev libqmi-glib-dev libmbim-glib-dev \
            protobuf-compiler protobuf-c-compiler dpkg-dev
          pip3 install --upgrade meson

      # ---- fastrpc ----
      - name: "Build fastrpc"
        run: |
          wget -q https://github.com/qualcomm/fastrpc/archive/refs/tags/v1.0.2.zip
          unzip -q v1.0.2.zip
          cd fastrpc-1.0.2
          autoreconf -is && ./configure --prefix=/usr && make -j$(nproc)
          make DESTDIR=$PWD/stage install
          mkdir -p stage/usr/lib/systemd/system
          cat > stage/usr/lib/systemd/system/adsprpcd-sensorspd.service << 'SVCEOF'
          [Unit]
          Description=Qualcomm ADSPRPC and SensorsPD daemon
          After=network.target
          
          [Service]
          Type=simple
          ExecStart=/usr/bin/adsprpcd
          Restart=on-failure
          
          [Install]
          WantedBy=multi-user.target
          SVCEOF

      # ---- libssc ----
      - name: "Build libssc"
        run: |
          git clone https://codeberg.org/DylanVanAssche/libssc.git libssc-src
          cd libssc-src
          meson setup build --prefix=/usr && meson compile -C build
          DESTDIR=$PWD/stage meson install -C build

      # ---- iio-sensor-proxy ----
      - name: "Build iio-sensor-proxy"
        run: |
          # Install libssc to system prefix so pkg-config can find it
          sudo cp -r libssc-src/stage/usr/* /usr/
          sudo ldconfig
          echo "libssc pkg-config:"
          pkg-config --cflags --libs libssc 2>&1 || echo "(not found via pkg-config)"
          # GitLab's archive endpoint returns HTTP errors from GitHub Actions
          # (wget exits with code 8).  Clone the upstream v3.9 tag instead;
          # the GitHub mirror is stale and does not carry this release.
          git clone --depth 1 --branch 3.9 https://gitlab.freedesktop.org/hadess/iio-sensor-proxy.git iio-sensor-proxy-3.9
          cd iio-sensor-proxy-3.9
          meson setup output --prefix=/usr -Dsystemdsystemunitdir=/usr/lib/systemd/system
          meson compile -C output
          DESTDIR=$PWD/stage meson install --no-rebuild -C output

      # ---- Package all as .deb for extraction ----
      - name: "Package device components"
        run: |
          mkdir -p output

          # fastrpc
          mkdir -p fastrpc/DEBIAN
          cp -r fastrpc-1.0.2/stage/usr fastrpc/
          cat > fastrpc/DEBIAN/control << EOF
          Package: fastrpc
          Version: 1.0.2-1
          Architecture: arm64
          Description: Qualcomm FastRPC userspace library
          EOF
          dpkg-deb --build fastrpc output/

          # libssc
          mkdir -p libssc/DEBIAN libssc/usr
          cp -r libssc-src/stage/usr/* libssc/usr/
          cat > libssc/DEBIAN/control << EOF
          Package: libssc
          Version: 0.3.0-1
          Architecture: arm64
          Description: Qualcomm Sensor Core library
          EOF
          dpkg-deb --build libssc output/

          # iio-sensor-proxy
          mkdir -p iio/DEBIAN
          cp -r iio-sensor-proxy-3.9/stage/usr iio/
          cat > iio/DEBIAN/control << EOF
          Package: iio-sensor-proxy
          Version: 99993.9-6
          Architecture: arm64
          Description: IIO sensors to D-Bus proxy (SSC patched)
          EOF
          dpkg-deb --build iio output/

          echo "Device component .debs:"
          ls -lah output/*.deb

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: device-components-deb
          path: output/*.deb
          retention-days: 3

  # ==========================================================================
  # sheng-sensors + sheng-devauth + firmware + ALSA
  # ==========================================================================
  build-firmware-sensors:
    name: "Build Firmware & Sensors"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Tools"
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev build-essential git

      - name: "Build sheng-devauth"
        run: |
          git clone https://github.com/ianchb/sheng_devauth.git source
          cd source && make
          mkdir -p ../deb-sheng-devauth/usr/bin
          cp xiaomi_devauth ../deb-sheng-devauth/usr/bin/
          chmod 755 ../deb-sheng-devauth/usr/bin/xiaomi_devauth
          mkdir -p ../deb-sheng-devauth/DEBIAN
          cat > ../deb-sheng-devauth/DEBIAN/control << EOF
          Package: sheng-devauth
          Version: 1.0.0-1
          Architecture: arm64
          Description: Keyboard auth daemon
          EOF
          cd .. && dpkg-deb --build --root-owner-group deb-sheng-devauth

      - name: "Package sheng-sensors (clone from debian-sheng)"
        run: |
          git clone --depth 1 https://github.com/ianchb/debian-sheng.git /tmp/debian-sheng
          mkdir -p deb-sheng-sensors/DEBIAN
          if [ -d /tmp/debian-sheng/sheng-sensors-files/usr ]; then
            cp -r /tmp/debian-sheng/sheng-sensors-files/usr deb-sheng-sensors/
          else
            mkdir -p deb-sheng-sensors/usr
          fi
          cat > deb-sheng-sensors/DEBIAN/control << EOF
          Package: sheng-sensors
          Version: 20240917-1
          Architecture: arm64
          Description: Sensor config files
          EOF
          dpkg-deb --build deb-sheng-sensors
          rm -rf /tmp/debian-sheng

      - name: "Package firmware"
        run: |
          git clone --depth 1 --branch "${{ inputs.firmware_branch }}" \
            "${{ inputs.firmware_repo }}" firmware-src
          mkdir -p firmware-xiaomi-sheng/usr/lib/firmware
          cp -r firmware-src/* firmware-xiaomi-sheng/usr/lib/firmware/
          dpkg-deb --build --root-owner-group firmware-xiaomi-sheng

      - name: "Package ALSA"
        run: dpkg-deb --build --root-owner-group alsa-xiaomi-sheng

      - name: "Download external .debs"
        run: |
          for repo in xiaomi-mipps-auth xiaomi-charger-mode xiaomi-sheng-thp \
                      xiaomi-pen-status xiaomi-sheng-fingerprint xiaomi-sheng-keyboard-helper; do
            TAG=$(gh release list --repo "ianchb/$repo" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -n "$TAG" ]; then
              gh release download "$TAG" --repo "ianchb/$repo" --pattern "*.deb" --clobber 2>/dev/null || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Collect all .debs"
        run: |
          mkdir -p output
          mv *.deb output/ 2>/dev/null || true
          ls -lah output/

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: firmware-sensors-deb
          path: output/*.deb
          retention-days: 3

  # ==========================================================================
  # RootFS Assembly
  # ==========================================================================
  build-rootfs:
    name: "Build RootFS"
    runs-on: ubuntu-24.04-arm
    needs:
      - build-kernel
      - build-device-components
      - build-firmware-sensors
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libarchive-tools android-sdk-libsparse-utils

      - name: "Download kernel (prebuilt)"
        if: ${{ inputs.kernel_source == 'prebuilt' }}
        run: |
          TAG=$(gh release list --repo ianchb/sm8550-mainline --limit 1 --json tagName -q '.[0].tagName')
          echo "Kernel tag: $TAG"
          gh release download "$TAG" --repo ianchb/sm8550-mainline --pattern "linux-xiaomi-sheng*.deb" --clobber
          gh release download "$TAG" --repo ianchb/sm8550-mainline --pattern "boot_sheng_*.img" --clobber
          echo "Downloaded:"
          ls -lah *.deb *.img 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download kernel (custom)"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/download-artifact@v4
        with: { name: kernel-deb }

      - name: "Download device components"
        uses: actions/download-artifact@v4
        with:
          name: device-components-deb
          path: lib/debs/

      - name: "Download firmware & sensors"
        uses: actions/download-artifact@v4
        with:
          name: firmware-sensors-deb
          path: lib/debs/



      - name: "Verify .deb files"
        run: |
          echo "=== Collected .deb packages ==="
          find . -name "*.deb" -exec ls -lh {} \;

      - name: "Cache Arch Linux ARM rootfs"
        uses: actions/cache@v4
        with:
          path: ArchLinuxARM-aarch64-latest.tar.gz
          key: archlinuxarm-rootfs-${{ hashFiles('sheng-steamos_build.sh') }}
          restore-keys: archlinuxarm-rootfs-

      # The upstream helper currently leaves qt6-multimedia-backend to
      # pacman's provider prompt, which has no stdin in CI.  It also creates
      # desktop-mode.service without enabling it, then always selects the
      # Game Mode marker.  Apply a small, asserted patch before building so
      # the KDE choice produces a bootable Plasma session.
      - name: "Fix non-interactive KDE image build"
        run: |
            python3 - <<'PY'
            from pathlib import Path

            path = Path("lib/gaming-packages.sh")
            text = path.read_text()
            build_path = Path("sheng-steamos_build.sh")
            build_text = build_path.read_text()

            old_kde = (
                '    if [ "$desktop" = "kde" ]; then\n'
                '        chroot "$rootdir" pacman -S --noconfirm --needed \\\n'
            )
            new_kde = (
                '    if [ "$desktop" = "kde" ]; then\n'
                '        # CI has no stdin for pacman provider prompts.\n'
                '        chroot "$rootdir" pacman -S --noconfirm --needed qt6-multimedia-ffmpeg\n'
                '        # Install the non-negotiable graphical-session pieces separately.\n'
                '        # The upstream optional bundle hides pacman failures with || true,\n'
                '        # which previously produced an image with no sddm.service.\n'
                '        chroot "$rootdir" pacman -S --noconfirm --needed sddm plasma-desktop plasma-workspace\n'
                '        test -x "$rootdir/usr/bin/sddm"\n'
                '        test -f "$rootdir/usr/lib/systemd/system/sddm.service"\n'
                '        chroot "$rootdir" pacman -S --noconfirm --needed \\\n'
            )
            old_default = (
                '    # ---- Default: Game Mode ----\n'
                '    touch "$rootdir/var/lib/sheng-steamos/gamemode-active"\n\n'
                '    mkdir -p "$rootdir/etc/systemd/system/graphical.target.wants"\n'
                '    ln -sf /etc/systemd/system/steam-gamemode.service \\\n'
                '        "$rootdir/etc/systemd/system/graphical.target.wants/steam-gamemode.service"\n'
            )
            old_before_cleanup = (
                'setup_gaming_session "$ROOTDIR" "$LAUNCHER" "$DESKTOP" "$USERNAME"\n\n'
                '# ==========================================================================\n'
                '# Step 9: Cleanup\n'
            )
            new_default = (
                '    # ---- KDE: start through the display manager ----\n'
                '    mkdir -p "$rootdir/etc/systemd/system/graphical.target.wants"\n'
                '    if [ "$desktop" = "kde" ]; then\n'
                '        # Do not launch Plasma as a system service: it leaves tty1\n'
                '        # visible on sheng.  SDDM creates the real graphical session.\n'
                '        rm -f "$rootdir/etc/systemd/system/graphical.target.wants/desktop-mode.service"\n'
                '        ln -sf /usr/lib/systemd/system/sddm.service \\\n'
                '            "$rootdir/etc/systemd/system/display-manager.service"\n'
                '        ln -sf /usr/lib/systemd/system/sddm.service \\\n'
                '            "$rootdir/etc/systemd/system/graphical.target.wants/sddm.service"\n'
                '    else\n'
                '        touch "$rootdir/var/lib/sheng-steamos/gamemode-active"\n'
                '        ln -sf /etc/systemd/system/steam-gamemode.service \\\n'
                '            "$rootdir/etc/systemd/system/graphical.target.wants/steam-gamemode.service"\n'
                '    fi\n'
            )
            new_before_cleanup = (
                'setup_gaming_session "$ROOTDIR" "$LAUNCHER" "$DESKTOP" "$USERNAME"\n\n'
                '# ---- Mandatory KDE completion gate ----\n'
                '# Step 6 is intentionally best-effort upstream, so perform the\n'
                '# desktop installation after it and outside that ignored subshell.\n'
                'if [ "$DESKTOP" = "kde" ]; then\n'
                '    echo "Verifying mandatory KDE desktop components..."\n'
                '    chroot "$ROOTDIR" pacman -S --noconfirm --needed \\\n'
                '        qt6-multimedia-ffmpeg sddm plasma-desktop plasma-workspace\n'
                '    chroot "$ROOTDIR" pacman -Q sddm plasma-desktop plasma-workspace\n'
                '    test -x "$ROOTDIR/usr/bin/sddm"\n'
                '    test -x "$ROOTDIR/usr/bin/startplasma-wayland"\n'
                '    test -f "$ROOTDIR/usr/lib/systemd/system/sddm.service"\n'
                '    test -f "$ROOTDIR/usr/share/wayland-sessions/plasma.desktop"\n'
                '    mkdir -p "$ROOTDIR/etc/sddm.conf.d" \\\n'
                '        "$ROOTDIR/etc/systemd/system/graphical.target.wants"\n'
                '    cat > "$ROOTDIR/etc/sddm.conf.d/autologin.conf" <<EOF\n'
                '[General]\n'
                'DisplayServer=wayland\n\n'
                '[Autologin]\n'
                'User=${USERNAME}\n'
                'Session=plasma.desktop\n'
                'EOF\n'
                '    rm -f "$ROOTDIR/etc/systemd/system/graphical.target.wants/desktop-mode.service"\n'
                '    rm -f "$ROOTDIR/etc/systemd/system/graphical.target.wants/steam-gamemode.service"\n'
                '    rm -f "$ROOTDIR/var/lib/sheng-steamos/gamemode-active"\n'
                '    ln -sf /usr/lib/systemd/system/sddm.service \\\n'
                '        "$ROOTDIR/etc/systemd/system/display-manager.service"\n'
                '    ln -sf /usr/lib/systemd/system/sddm.service \\\n'
                '        "$ROOTDIR/etc/systemd/system/graphical.target.wants/sddm.service"\n'
                'fi\n\n'
                '# ==========================================================================\n'
                '# Step 9: Cleanup\n'
            )
            replacements = {
                old_kde: new_kde,
                old_default: new_default,
            }

            for old, new in replacements.items():
                if old not in text:
                    raise SystemExit(f"Expected upstream block not found: {old[:60]!r}")
                text = text.replace(old, new, 1)

            if old_before_cleanup not in build_text:
                raise SystemExit("Expected Step 8/9 boundary not found in build script")
            build_text = build_text.replace(old_before_cleanup, new_before_cleanup, 1)

            path.write_text(text)
            build_path.write_text(build_text)
            PY

      - name: "Build SteamOS Image"
        run: |
          chmod +x sheng-steamos_build.sh lib/*.sh
          sudo bash sheng-steamos_build.sh \
            --desktop=kde \
            --launcher="${{ inputs.launcher || 'both' }}" \
            --boot="${{ (inputs.boot_mode || 'dual (linux)') == 'dual (linux)' && 'dual' || 'single' }}" \
            --autologin="${{ inputs.autologin || 'true' }}" \
            --username="${{ inputs.username || 'gamer' }}" \
            --hostname="${{ inputs.hostname || 'sheng-steamos' }}" \
            --output=image \
            --mode=ci

      # Do not upload a rootfs merely because the builder exited cleanly.
      # Inspect the *compressed final image* so the file we flash is proven
      # to contain SDDM and the display-manager enablement links.
      - name: "Verify final image contains enabled KDE desktop"
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name '*.7z' -print -quit)"
          test -n "$archive"
          verify_dir="$(mktemp -d)"
          7z x "$archive" "-o$verify_dir"
          sparse_image="$(find "$verify_dir" -type f -name 'sparse_*.img' -print -quit)"
          test -n "$sparse_image"
          simg2img "$sparse_image" "$verify_dir/rootfs.ext4"
          for file in \
            /usr/bin/sddm \
            /usr/bin/startplasma-wayland \
            /usr/lib/systemd/system/sddm.service \
            /usr/share/wayland-sessions/plasma.desktop \
            /etc/sddm.conf.d/autologin.conf \
            /etc/systemd/system/display-manager.service \
            /etc/systemd/system/graphical.target.wants/sddm.service; do
            echo "Checking $file"
            sudo debugfs -R "stat $file" "$verify_dir/rootfs.ext4" 2>&1 | grep -q 'Inode:'
          done

      - name: "Upload RootFS"
        uses: actions/upload-artifact@v4
        with:
          name: steamos-rootfs
          path: "*.7z"
          retention-days: 14
          compression-level: 1

      - name: "Prepare boot images"
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== All files ==="
          ls -lah
          echo "=== Find .img files ==="
          find . -name '*.img' -type f 2>/dev/null || echo "(none)"
          echo "=== Find .7z files ==="
          find . -name '*.7z' -type f 2>/dev/null || echo "(none)"
          sudo chmod 644 *.img *.7z 2>/dev/null || true
          sudo chown $(id -u):$(id -g) *.img *.7z 2>/dev/null || true

      - name: "Upload Boot Images"
        uses: actions/upload-artifact@v4
        with:
          name: steamos-boot
          path: "*.img"
          retention-days: 14
          if-no-files-found: warn

      - name: "Upload Package List"
        uses: actions/upload-artifact@v4
        with:
          name: steamos-pkglist
          path: sheng-steamos_packages_*.txt
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # Create Release
  # ==========================================================================
  create-release:
    name: "Create Release"
    runs-on: ubuntu-24.04-arm
    needs: [build-rootfs]
    if: ${{ !inputs.skip_release && needs.build-rootfs.result == 'success' }}
    steps:
      - name: "Generate Tag"
        id: tag
        run: echo "tag=steamos-$(date -u '+%Y%m%d')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: "Download RootFS"
        uses: actions/download-artifact@v4
        with: { name: steamos-rootfs }

      - name: "Download Boot Images"
        uses: actions/download-artifact@v4
        with:
          name: steamos-boot
          merge-multiple: true
        continue-on-error: true

      - name: "Create Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "SteamOS ${{ steps.tag.outputs.tag }}"
          body: |
            **SteamOS Gaming System (Arch Linux ARM)**

            | Item | Detail |
            |------|--------|
            | Base | Arch Linux ARM |
            | Desktop | ${{ inputs.desktop }} |
            | Launcher | ${{ inputs.launcher }} |
            | Boot | ${{ inputs.boot_mode }} |
            | Architecture | Parallel component builds |

            ### Components
            - Mesa (from Arch Linux ARM repos)
            - **Native ARM64 Steam** client + Proton ARM64
            - **FEX-Emu** + **Box64** (x86/x64 translation)
            - **Eden** (Nintendo Switch emulator, Yuzu fork)
            - RetroArch + 20 cores, Dolphin, PPSSPP, mGBA, DOSBox, ScummVM
            - Lutris, Heroic Games Launcher, Wine, GameMode, MangoHud
            - Gamescope compositor
            - Device: fastrpc, libssc, iio-sensor-proxy, sensors, devauth, firmware, ALSA
            - Touchscreen, stylus, fingerprint, keyboard, fast-charge
          files: |
            *.7z
            boot.img
            boot_sheng_*.img
            sheng-steamos_boot_*.img
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish"
        run: gh release edit "${{ steps.tag.outputs.tag }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
