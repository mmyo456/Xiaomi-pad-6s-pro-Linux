name: RootFS Build Template

on:
  workflow_call:
    inputs:
      distro:
        description: 'Distro identifier passed to script'
        required: true
        type: string
      script:
        description: 'Rootfs build script to run'
        required: true
        type: string
      kernel_version_default:
        description: 'Default kernel version'
        required: true
        type: string
      kernel_channel_default:
        description: 'Default kernel release channel'
        required: false
        type: string
        default: 'mainline'
      kernel_channel:
        description: 'Requested kernel release channel'
        required: false
        type: string
        default: ''
      kernel_bundle_repo:
        description: 'Repository containing kernel bundle releases'
        required: false
        type: string
        default: ''
      desktop_env:
        description: 'Desktop environment from user input'
        required: false
        type: string
        default: ''
      boot_mode:
        description: 'Boot mode from user input'
        required: false
        type: string
        default: ''
      desktop_matrix:
        description: 'Desktop environment matrix (JSON array)'
        required: false
        type: string
        default: '["all"]'
      boot_matrix:
        description: 'Boot mode matrix (JSON array)'
        required: false
        type: string
        default: '["all"]'
      release_tag_prefix:
        description: 'Prefix for release tag'
        required: true
        type: string
      release_body_title:
        description: 'Title for release body'
        required: false
        type: string
        default: ''
      skip_release:
        description: 'Skip creating GitHub Release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(inputs.desktop_matrix) }}
        boot: ${{ fromJSON(inputs.boot_matrix) }}
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      build_success: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.release_tag_prefix }}-$(date -u '+%Y%m%d')-${GITHUB_SHA::8}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ inputs.release_tag_prefix }}-${{ hashFiles('.github/workflows/_rootfs-template.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-${{ inputs.release_tag_prefix }}-
            ${{ runner.os }}-apt-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap libarchive-tools p7zip-full curl wget android-sdk-libsparse-utils

      - name: Download kernel bundle
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_VER="${{ inputs.kernel_version_default }}"
          CHANNEL="${{ inputs.kernel_channel || inputs.kernel_channel_default }}"
          BUNDLE_REPO="${{ inputs.kernel_bundle_repo || github.repository }}"

          case "$CHANNEL" in
            mainline) BUNDLE_TAG="kernel-bundle-${KERNEL_VER}" ;;
            stable) BUNDLE_TAG="kernel-bundle-stable-${KERNEL_VER}" ;;
            *)
              echo "错误: 不支持的内核通道: $CHANNEL" >&2
              exit 1
              ;;
          esac

          echo "Downloading $BUNDLE_TAG from $BUNDLE_REPO"
          if ! gh release view "$BUNDLE_TAG" --repo "$BUNDLE_REPO" >/dev/null; then
            echo "错误: 未找到内核 Bundle: $BUNDLE_REPO / $BUNDLE_TAG" >&2
            exit 1
          fi

          gh release download "$BUNDLE_TAG" \
            --pattern '*.deb' \
            --repo "$BUNDLE_REPO" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RootFS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_VER="${{ inputs.kernel_version_default }}"
          BOOT_MODE="${{ inputs.boot_mode || matrix.boot }}"
          DESKTOP_ENV="${{ inputs.desktop_env || matrix.desktop }}"
          chmod +x "${{ inputs.script }}"
          sudo bash "${{ inputs.script }}" "${{ inputs.distro }}" "$KERNEL_VER" \
            "$BOOT_MODE" "$DESKTOP_ENV"
          echo "pkg_count=$(find . -maxdepth 1 -name '*.7z' -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag_prefix }}-${{ inputs.desktop_env || matrix.desktop }}-${{ inputs.boot_mode || matrix.boot }}
          path: '*.7z'
          retention-days: 7
          if-no-files-found: error

  create-release:
    name: '创建 Release'
    runs-on: ubuntu-24.04-arm
    needs: [build]
    permissions:
      contents: write
    if: ${{ !inputs.skip_release && needs.build.result == 'success' }}
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: '${{ inputs.release_body_title || inputs.release_tag_prefix }} - ${{ needs.build.outputs.release_tag }}'
          body: |
            **${{ inputs.release_body_title || inputs.release_tag_prefix }}**

            | 项目 | 详情 |
            |------|------|
            | 内核版本 | ${{ inputs.kernel_version_default }} |
            | 内核通道 | ${{ inputs.kernel_channel || inputs.kernel_channel_default }} |
            | 桌面环境 | ${{ inputs.desktop_env || inputs.desktop_matrix }} |
            | 启动模式 | ${{ inputs.boot_mode || inputs.boot_matrix }} |
            | 构建 SHA | [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.release_tag_prefix }}-*
          merge-multiple: true

      - name: Upload assets and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: '*.7z'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
